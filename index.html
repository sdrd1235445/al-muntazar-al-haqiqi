<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتظر الحقيقي - عجل الله فرجه</title>
    <meta name="google-site-verification" content="QQ5chiWhodN5xi4gtqx8v5m8AT-">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .quran-font { font-family: 'Amiri', serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24">

    <!-- Side Navigation Drawer -->
    <div id="sidebar" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity" onclick="toggleSidebar()">
        <div class="absolute right-0 top-0 bottom-0 w-80 bg-white shadow-2xl p-5 overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6 border-b pb-3">
                <h3 class="font-bold text-emerald-900 text-lg"><i class="fa-solid fa-bars-staggered ml-2"></i>خدمات المنتظر</h3>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-red-500 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-2 text-xs">
                <button onclick="switchTab('quran'); toggleSidebar();" class="w-full flex items-center gap-3 p-3 rounded-xl bg-emerald-50 text-emerald-700 font-semibold"><i class="fa-solid fa-book-quran text-base"></i>القرآن الكريم والأجزاء</button>
                <button onclick="switchTab('duas'); toggleSidebar();" class="w-full flex items-center gap-3 p-3 rounded-xl bg-blue-50 text-blue-700 font-semibold"><i class="fa-solid fa-hands-praying text-base"></i>الأدعية والزيارات</button>
                <button onclick="switchTab('tasbih'); toggleSidebar();" class="w-full flex items-center gap-3 p-3 rounded-xl bg-purple-50 text-purple-700 font-semibold"><i class="fa-solid fa-circle-dot text-base"></i>المسبحة الإلكترونية</button>
                <button onclick="switchTab('challenges'); toggleSidebar();" class="w-full flex items-center gap-3 p-3 rounded-xl bg-amber-50 text-amber-700 font-semibold"><i class="fa-solid fa-bullseye text-base"></i>التحدي الروحي اليومي</button>
                <button onclick="switchTab('prayers'); toggleSidebar();" class="w-full flex items-center gap-3 p-3 rounded-xl bg-teal-50 text-teal-700 font-semibold"><i class="fa-solid fa-person-praying text-base"></i>الصلوات المستحبة والنوافل</button>
                <button onclick="switchTab('monthly_prayers'); toggleSidebar();" class="w-full flex items-center gap-3 p-3 rounded-xl bg-rose-50 text-rose-700 font-semibold"><i class="fa-solid fa-calendar-days text-base"></i>المواقيت الشهرية للمحافظات</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-emerald-800 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button onclick="toggleSidebar()" class="text-white text-xl mr-1"><i class="fa-solid fa-bars"></i></button>
                <i class="fa-solid fa-kaaba text-amber-400 text-xl"></i>
                <h1 class="font-bold text-lg">المنتظر الحقيقي</h1>
            </div>
            <div id="hijri-date-display" class="text-xs bg-emerald-900/60 px-3 py-1 rounded-full text-amber-200 font-semibold">
                جاري تحديث التاريخ...
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto p-4 max-w-md">
        
        <!-- Prayer Time & Location Card with 18 Governorates Selector -->
        <section class="bg-gradient-to-br from-emerald-700 to-emerald-900 text-white rounded-2xl p-5 shadow-lg mb-5 relative overflow-hidden">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <span id="user-location-label" class="text-xs text-amber-300 font-semibold block">مواقيت الصلاة (الديوانية)</span>
                    <h2 id="current-prayer-name" class="text-xl font-bold mt-1">صلاة المغرب</h2>
                </div>
                <!-- زر اختيار المحافظات الـ 18 -->
                <select id="governorate-select" onchange="changeGovernorate(this.value)" class="bg-emerald-600 text-white text-[11px] px-2 py-1.5 rounded-lg font-semibold border-0 outline-none cursor-pointer">
                    <option value="الديوانية">الديوانية</option>
                    <option value="بغداد">بغداد</option>
                    <option value="البصرة">البصرة</option>
                    <option value="نجف الأشرف">النجف الأشرف</option>
                    <option value="كربلاء المقدسة">كربلاء المقدسة</option>
                    <option value="المثنى">المثنى</option>
                    <option value="ذي قار">ذي قار</option>
                    <option value="ميسان">ميسان</option>
                    <option value="الواسط">واسط</option>
                    <option value="بابل">بابل</option>
                    <option value="المصلى">السليمانية</option>
                    <option value="أربيل">أربيل</option>
                    <option value="دهوك">دهوك</option>
                    <option value="كركوك">كركوك</option>
                    <option value="صلاح الدين">صلاح الدين</option>
                    <option value="ديالى">ديالى</option>
                    <option value="الأنبار">الأنبار</option>
                    <option value="نينوى">نينوى</option>
                </select>
            </div>
            <div class="text-3xl font-bold tracking-wider text-amber-200" id="current-prayer-time">٠٧:١٣ م</div>
        </section>

        <!-- Quick Nav Grid -->
        <div class="grid grid-cols-4 gap-3 mb-6">
            <button onclick="switchTab('quran')" class="flex flex-col items-center bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-700 flex items-center justify-center text-lg mb-1.5"><i class="fa-solid fa-book-quran"></i></div>
                <span class="text-xs font-semibold text-slate-700">القرآن</span>
            </button>
            <button onclick="switchTab('duas')" class="flex flex-col items-center bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-700 flex items-center justify-center text-lg mb-1.5"><i class="fa-solid fa-hands-praying"></i></div>
                <span class="text-xs font-semibold text-slate-700">الأدعية</span>
            </button>
            <button onclick="switchTab('tasbih')" class="flex flex-col items-center bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <div class="w-12 h-12 rounded-full bg-purple-50 text-purple-700 flex items-center justify-center text-lg mb-1.5"><i class="fa-solid fa-circle-dot"></i></div>
                <span class="text-xs font-semibold text-slate-700">المسبحة</span>
            </button>
            <button onclick="switchTab('challenges')" class="flex flex-col items-center bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-700 flex items-center justify-center text-lg mb-1.5"><i class="fa-solid fa-bullseye"></i></div>
                <span class="text-xs font-semibold text-slate-700">التحدي اليومي</span>
            </button>
        </div>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 min-h-[350px]">
            <!-- Content injected dynamically -->
        </div>

    </main>

    <!-- Bottom Nav Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 flex justify-around items-center z-40 shadow-lg">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-emerald-700">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1 font-bold">الرئيسية</span>
        </button>
        <button onclick="switchTab('quran')" class="flex flex-col items-center text-slate-400 hover:text-emerald-700">
            <i class="fa-solid fa-book-open text-lg"></i>
            <span class="text-[10px] mt-1">القرآن</span>
        </button>
        <button onclick="switchTab('duas')" class="flex flex-col items-center text-slate-400 hover:text-emerald-700">
            <i class="fa-solid fa-hands-praying text-lg"></i>
            <span class="text-[10px] mt-1">الأدعية</span>
        </button>
        <button onclick="switchTab('challenges')" class="flex flex-col items-center text-slate-400 hover:text-emerald-700">
            <i class="fa-solid fa-bullseye text-lg"></i>
            <span class="text-[10px] mt-1">التحدي</span>
        </button>
        <button onclick="switchTab('tasbih')" class="flex flex-col items-center text-slate-400 hover:text-emerald-700">
            <i class="fa-solid fa-circle-dot text-lg"></i>
            <span class="text-[10px] mt-1">المسبحة</span>
        </button>
    </nav>

    <script src="data.js?v=9"></script>
</body>
</html>
